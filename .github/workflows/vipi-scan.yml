name: VIPI image scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The released Action, installing VIPI from this PR's commit.
      - uses: EnXan/vipi-action@78c36b1456007730e8d003ca0e9b9c3bdfdd9cd6 # v1.2.0
        with:
          vipi-ref: ${{ github.event.pull_request.head.sha }}
          pr-comment: true
          detector: prompt-guard
          modus: local
          ocr-mode: balanced
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
