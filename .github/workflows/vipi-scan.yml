name: VIPI image scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The released Action, installing VIPI from this PR's commit.
      - uses: EnXan/vipi-action@41990d11430e1a2a88ce0487c2354c14d4d3355f # v1.3.0
        with:
          vipi-ref: ${{ github.event.pull_request.head.sha }}
          detector: prompt-guard
          modus: local
          ocr-mode: balanced
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
