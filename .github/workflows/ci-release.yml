name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"

      - name: Install project dependencies
        run: uv sync --locked --extra ocr --extra detector-local --extra research --extra test

      - name: Lint
        run: uv run --locked ruff check src/vipi research tests

      - name: Run unit and integration tests
        run: uv run --locked pytest -q tests/unit tests/integration

      - name: Run research tests
        run: uv run --locked pytest -q tests/research

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl -- vipi --help

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz -- vipi --help

      - name: Upload distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vipi-scanner
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
          ignore-empty-workdir: true

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        run: uv publish dist/*

  github-release:
    name: create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create GitHub release with generated notes
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          # Previous release tag: highest vX.Y.Z below this one by version
          # sort. v1.0.5 is a stray tag on an unrelated commit and is ignored.
          previous="$(
            {
              gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -vxF -e 'v1.0.5' -e "$TAG" || true
              echo "$TAG"
            } | sort -V | awk -v tag="$TAG" '$0 == tag { print prev; exit } { prev = $0 }'
          )"

          args=(--verify-tag --title "$TAG" --generate-notes --latest)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "${args[@]}"
