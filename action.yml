name: VIPI Image Scan
description: Scan repository images for visual prompt injections
inputs:
  paths:
    description: Newline-separated image files or directories to scan
    required: false
    default: .
  base-ref:
    description: Optional base branch for non-PR diff scans; PRs always use their actual base branch
    required: false
  exclude:
    description: Newline-separated exclusion rules, applied after .vipiignore (diff scans read it from the base branch)
    required: false
    default: ""
  detector:
    description: Injection detector (auto selects the decision model for the mode)
    required: false
    default: auto
  modus:
    description: Full scan execution (local or cloud)
    default: local
  ocr-provider:
    description: Cloud OCR provider (google, openai, mistral)
    default: google
  decision-provider:
    description: Optional decision model override (local clef/d1, cloud openai/jev)
    default: ""
  threshold:
    description: Finding threshold on a 0–100 score scale
    required: false
    default: "80"
  ocr-mode:
    description: OCR model mode (fast, balanced, or quality)
    required: false
    default: quality
  report-path:
    description: JSON report path relative to the caller repository
    required: false
    default: vipi-report.json
outputs:
  report-path:
    description: Path to the JSON report, including findings and scan errors
    value: ${{ steps.scan.outputs.report-path }}
runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock

    - name: Install VIPI with OCR
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked --extra ocr

    - name: Select images
      id: select
      shell: bash
      env:
        VIPI_PATHS: ${{ inputs.paths }}
        VIPI_BASE_REF: ${{ inputs.base-ref }}
        VIPI_EXCLUDE: ${{ inputs.exclude }}
        XDG_CACHE_HOME: ${{ runner.temp }}/vipi-cache
      run: |
        if [[ -z "${VIPI_PATHS//$'\n'/}" ]]; then
          echo "The paths input must contain at least one path." >&2
          exit 2
        fi
        base_ref="$VIPI_BASE_REF"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
          base_ref="${GITHUB_BASE_REF:-}"
          if [[ -z "$base_ref" ]]; then
            echo "Could not determine the pull request base branch." >&2
            exit 2
          fi
        fi
        diff_ref=""
        if [[ -n "$base_ref" ]]; then
          diff_ref="origin/$base_ref"
        fi
        echo "diff=$diff_ref" >> "$GITHUB_OUTPUT"
        # Use the scanner's own selection so models are prepared only when needed.
        args=()
        while IFS= read -r path; do
          [[ -n "$path" ]] && args+=("$path")
        done <<< "$VIPI_PATHS"
        args+=(--list-only --output "$RUNNER_TEMP/vipi-selection.json")
        if [[ -n "$diff_ref" ]]; then
          args+=(--diff "$diff_ref")
        fi
        while IFS= read -r rule; do
          [[ -n "${rule//[[:space:]]/}" ]] && args+=(--exclude="$rule")
        done <<< "$VIPI_EXCLUDE"
        rm -f "$RUNNER_TEMP/vipi-selection.json"
        # Selection errors fail the scan step with the same message before models load.
        uv run --project "$GITHUB_ACTION_PATH" vipi scan "${args[@]}" || true
        count=0
        if [[ -f "$RUNNER_TEMP/vipi-selection.json" ]]; then
          count=$(uv run --project "$GITHUB_ACTION_PATH" python -c \
            'import json, sys; print(len(json.load(open(sys.argv[1]))["files"]))' \
            "$RUNNER_TEMP/vipi-selection.json")
        fi
        echo "Selected images: $count"
        echo "images=$count" >> "$GITHUB_OUTPUT"

    - name: Install local decision dependencies
      if: inputs.modus == 'local' && steps.select.outputs.images != '0'
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --locked --extra ocr --extra detector-local

    - name: Prepare scan models
      if: steps.select.outputs.images != '0'
      shell: bash
      env:
        VIPI_DETECTOR: ${{ inputs.detector }}
        VIPI_OCR_MODE: ${{ inputs.ocr-mode }}
        VIPI_MODUS: ${{ inputs.modus }}
        VIPI_OCR_PROVIDER: ${{ inputs.ocr-provider }}
        VIPI_DECISION_PROVIDER: ${{ inputs.decision-provider }}
        XDG_CACHE_HOME: ${{ runner.temp }}/vipi-cache
      run: |
        args=(--modus "$VIPI_MODUS" --detector "$VIPI_DETECTOR")
        if [[ "$VIPI_MODUS" == "local" ]]; then
          args+=(--ocr-mode "$VIPI_OCR_MODE")
        else
          args+=(--ocr-provider "$VIPI_OCR_PROVIDER")
        fi
        if [[ -n "$VIPI_DECISION_PROVIDER" ]]; then
          args+=(--decision-provider "$VIPI_DECISION_PROVIDER")
        fi
        uv run --project "$GITHUB_ACTION_PATH" vipi setup "${args[@]}"

    - name: Scan images
      id: scan
      shell: bash
      env:
        VIPI_PATHS: ${{ inputs.paths }}
        VIPI_DIFF: ${{ steps.select.outputs.diff }}
        VIPI_EXCLUDE: ${{ inputs.exclude }}
        VIPI_DETECTOR: ${{ inputs.detector }}
        VIPI_THRESHOLD: ${{ inputs.threshold }}
        VIPI_OCR_MODE: ${{ inputs.ocr-mode }}
        VIPI_MODUS: ${{ inputs.modus }}
        VIPI_OCR_PROVIDER: ${{ inputs.ocr-provider }}
        VIPI_DECISION_PROVIDER: ${{ inputs.decision-provider }}
        VIPI_REPORT_PATH: ${{ inputs.report-path }}
        XDG_CACHE_HOME: ${{ runner.temp }}/vipi-cache
      run: |
        paths=()
        while IFS= read -r path; do
          [[ -n "$path" ]] && paths+=("$path")
        done <<< "$VIPI_PATHS"

        args=("${paths[@]}" --modus "$VIPI_MODUS" --detector "$VIPI_DETECTOR" --threshold "$VIPI_THRESHOLD" --output "$VIPI_REPORT_PATH")
        if [[ "$VIPI_MODUS" == "local" ]]; then
          args+=(--ocr-mode "$VIPI_OCR_MODE")
        else
          args+=(--ocr-provider "$VIPI_OCR_PROVIDER")
        fi
        if [[ -n "$VIPI_DECISION_PROVIDER" ]]; then
          args+=(--decision-provider "$VIPI_DECISION_PROVIDER")
        fi
        if [[ -n "$VIPI_DIFF" ]]; then
          args+=(--diff "$VIPI_DIFF")
        fi
        while IFS= read -r rule; do
          [[ -n "${rule//[[:space:]]/}" ]] && args+=(--exclude="$rule")
        done <<< "$VIPI_EXCLUDE"

        echo "report-path=$VIPI_REPORT_PATH" >> "$GITHUB_OUTPUT"
        uv run --project "$GITHUB_ACTION_PATH" vipi scan "${args[@]}"
