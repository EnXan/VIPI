      .bar { fill: #0B0C10; }
      .head { fill: #0B0C10; font: 500 15px "Geist", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.01em; }
      .label { fill: #0B0C10; font: 400 13px "Geist", "Helvetica Neue", Arial, sans-serif; }
      .value { fill: #5C616C; font: 500 11px "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
      .tick { fill: #5C616C; font: 500 10px "Geist Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; }
      .group { fill: #5C616C; font: 500 10px "Geist Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #121318; stroke: rgba(242,243,245,.12); }
        .grid { stroke: rgba(242,243,245,.10); }
        .base { stroke: rgba(242,243,245,.35); }
