<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 408" role="img" aria-labelledby="title desc">
  <title id="title">Latest results: detection rate and false positive rate</title>
  <desc id="desc">Development split, 227 injection and 223 benign images, threshold 80. Cloud: Mistral OCR + Jev: detection rate 81.5%, false positive rate 0.4%; Mistral OCR + GPT-6 Luna: detection rate 85.0%, false positive rate 4.5%; GPT-6 Luna + GPT-6 Luna: detection rate 83.3%, false positive rate 4.5%; GPT-6 Luna + Jev: detection rate 78.9%, false positive rate 1.3%; Cloud Vision + GPT-6 Luna (default): detection rate 78.4%, false positive rate 3.6%; Cloud Vision + Jev: detection rate 74.0%, false positive rate 0.9%. Local: Quality + Clef-Flash (default): detection rate 16.7%, false positive rate 0%; Quality + Prompt Guard 2: detection rate 19.4%, false positive rate 1.8%; Balanced + d1: detection rate 15.4%, false positive rate 0.4%; Balanced + Prompt Guard 2: detection rate 16.7%, false positive rate 1.8%; Speed + d1: detection rate 15.0%, false positive rate 0.4%; Speed + Prompt Guard 2: detection rate 18.5%, false positive rate 2.2%.</desc>
