[project]
name = "vipi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.32.0",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
ocr = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "rapidocr==3.9.2",
    "onnxruntime==1.23.2",
    "torch==2.6.0",
    "tensorflow==2.19.0",
    "Flask==3.1.2",
]
ocr-cuda = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "rapidocr==3.9.2",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.8,<13; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.6.0",
    "tensorflow==2.19.0",
    "Flask==3.1.2",
]
test = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
vipi-ocr = "ocr_pipeline.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "ocr" }, { extra = "ocr-cuda" }]]

# Resizing uses CPU tensors; avoid a second CUDA stack from PyTorch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
