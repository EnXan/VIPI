[project]
name = "vipi-scanner"
version = "0.5.0"
description = "Detect visual prompt injections in images with OCR, a Python CLI, and a GitHub Action"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = [
    "visual prompt injection",
    "image prompt injection",
    "LLM security",
    "OCR",
    "image scanner",
    "GitHub Actions",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.2.4,<2",
    "rich",
]

[project.urls]
Homepage = "https://github.com/EnXan/VIPI"
Documentation = "https://github.com/EnXan/VIPI/blob/main/docs/cli.md"
Repository = "https://github.com/EnXan/VIPI"
Issues = "https://github.com/EnXan/VIPI/issues"
Changelog = "https://github.com/EnXan/VIPI/releases"
Dataset = "https://huggingface.co/datasets/EnXan/VIPI-evaluation"

[project.optional-dependencies]
ocr = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "rapidocr==3.9.2",
    "onnxruntime==1.23.2",
    "torch==2.6.0",
    "tensorflow==2.21.0",
]
ocr-cuda = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "rapidocr==3.9.2",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.8,<13; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.6.0",
    "tensorflow==2.21.0",
]
test = ["pytest==8.4.2", "ruff==0.14.0"]
detector-local = [
    "huggingface-hub>=1.32.0",
    "torch==2.6.0",
    "transformers==5.8.1",
    "sentencepiece==0.2.1",
    "safetensors==0.8.0",
]
research = [
    "Flask==3.1.2",
    "jsonschema>=4.26.0",
    "huggingface-hub>=1.32.0",
    "scipy",
]
ocr-paddle-vl = [
    "paddleocr[doc-parser]>=3.6.0",
    "paddlepaddle>=3.2.1",
]
ocr-granite-docling = [
    "docling>=2.0",
]
ocr-lighton = [
    "Pillow==11.3.0",
    "torch==2.6.0",
    "transformers==5.8.1",
]

[project.scripts]
vipi = "vipi.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vipi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/vipi",
    "/tests/unit",
    "/tests/integration",
    "/tests/conftest.py",
    "/tests/fixtures",
    "/README.md",
    "/.env.example",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/docs/cli.md",
    "/docs/architecture.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
conflicts = [
    [{ extra = "ocr" }, { extra = "ocr-cuda" }],
]

# Resizing uses CPU tensors; avoid a second CUDA stack from PyTorch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
