[project]
name = "vipi-scanner"
version = "0.2.0"
description = "Scan images for visual indirect prompt injections"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.4,<2",
    "rich",
]

[project.optional-dependencies]
ocr = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "rapidocr==3.9.2",
    "onnxruntime==1.23.2",
    "torch==2.6.0",
    "tensorflow==2.19.0",
]
ocr-cuda = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "rapidocr==3.9.2",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.8,<13; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.6.0",
    "tensorflow==2.19.0",
]
test = ["pytest==8.4.2", "ruff==0.14.0"]
detector-local = [
    "huggingface-hub>=1.32.0",
    "torch==2.6.0",
    "transformers==5.8.1",
    "sentencepiece==0.2.1",
    "safetensors==0.8.0",
]
research = [
    "Flask==3.1.2",
    "jsonschema>=4.26.0",
    "huggingface-hub>=1.32.0",
    "scipy",
]

[project.scripts]
vipi = "vipi.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vipi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/vipi",
    "/tests/unit",
    "/tests/integration",
    "/tests/conftest.py",
    "/tests/fixtures",
    "/README.md",
    "/.env.example",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/docs/cli.md",
    "/docs/architecture.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "ocr" }, { extra = "ocr-cuda" }]]

# Resizing uses CPU tensors; avoid a second CUDA stack from PyTorch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
