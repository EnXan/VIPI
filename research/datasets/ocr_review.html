<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIPI · OCR Review</title>
  <style>
    :root { color-scheme: light; --ink:#17231d; --muted:#65736b; --line:#dce4dd; --paper:#f3f6f2; --green:#17633d; --green2:#e4f1e8; --amber:#7c5010; --amberbg:#fff3d8; }
    * { box-sizing:border-box }
    body { margin:0; height:100vh; overflow:hidden; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper) }
    header { height:64px; padding:0 22px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--line); background:#fff }
    header h1 { margin:0; font-size:17px; letter-spacing:-.02em }
    .brand { width:30px; height:30px; border-radius:9px; background:var(--green); color:#fff; display:grid; place-items:center; font-weight:750 }
    .grow { flex:1 }
    .counter { color:var(--muted); font-variant-numeric:tabular-nums }
    .layout { height:calc(100vh - 64px); display:grid; grid-template-columns:minmax(390px, 43%) 1fr; min-height:0 }
    aside { display:flex; flex-direction:column; min-height:0; background:#fff; border-right:1px solid var(--line) }
    .filters { padding:17px 20px 12px; display:grid; grid-template-columns:1fr 145px; gap:10px; border-bottom:1px solid var(--line) }
    label.small { display:block; margin:0 0 5px; color:var(--muted); font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.06em }
    select,button,textarea { font:inherit }
    select { width:100%; padding:9px 10px; background:white; color:var(--ink); border:1px solid var(--line); border-radius:8px }
    .counts { grid-column:1/-1; color:var(--muted); font-size:12px }
    .itemnav { display:flex; gap:8px; padding:12px 20px 6px; align-items:center }
    button { cursor:pointer; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); padding:9px 12px; font-weight:620 }
    button:hover:not(:disabled) { border-color:#9eb3a3; background:#f8fbf8 }
    button:disabled { cursor:not-allowed; opacity:.45 }
    .item-position { color:var(--muted); font-size:12px; margin-left:auto; font-variant-numeric:tabular-nums }
    .record-info { padding:4px 20px 10px; min-height:70px }
    .record-title { font-weight:700; overflow-wrap:anywhere }
    .meta { margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:11px }
    .pill { border-radius:999px; padding:2px 8px; background:#eef2ee; color:#45564a }
    .pill.warn { background:var(--amberbg); color:var(--amber) }
    .metadata-panel { margin:0 20px 10px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#fbfcfb; flex:0 1 150px; min-height:88px; max-height:168px; overflow-y:auto; overflow-anchor:none; scrollbar-color:#c7d2ca transparent }
    .metadata-title { position:sticky; top:-9px; z-index:1; padding:0 0 6px; background:#fbfcfb; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase }
    .metadata-title-row { display:flex; justify-content:space-between; align-items:center; gap:8px }
    .metadata-title-row button { padding:4px 8px; font-size:11px; text-transform:none; letter-spacing:0 }
    .metadata-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px }
    .metadata-item { min-width:0 }
    .metadata-item.wide { grid-column:1/-1 }
    .metadata-label { color:var(--muted); font-size:10px; line-height:1.2; text-transform:uppercase; letter-spacing:.04em }
    .metadata-value { margin-top:2px; overflow-wrap:anywhere; color:var(--ink); font-size:12px; line-height:1.35 }
    .metadata-note { margin-top:7px; color:var(--muted); font-size:10px }
    .swatch { display:inline-block; width:11px; height:11px; margin:0 5px 0 0; vertical-align:-1px; border:1px solid #9aa69d; border-radius:3px }
    .scope-warning { margin:0 20px 11px; padding:10px 11px; border:1px solid #ead9b5; background:#fffaf0; border-radius:8px; color:#604c2c; font-size:12px }
    .scope-warning strong { color:#4c3817 }
    .editor-wrap { display:flex; flex:1; min-height:120px; flex-direction:column; padding:0 20px }
    textarea { flex:1; width:100%; resize:none; min-height:150px; padding:13px; border:1px solid var(--line); border-radius:9px; color:var(--ink); line-height:1.55; outline:none }
    textarea:focus { border-color:#659576; box-shadow:0 0 0 3px #17633d1c }
    .edit-foot { display:flex; justify-content:space-between; align-items:center; min-height:34px; color:var(--muted); font-size:11px }
    .dirty { color:#9a5d00; font-weight:650 }
    .actions { display:flex; gap:8px; padding:10px 20px 18px; border-top:1px solid var(--line); flex-wrap:wrap }
    .actions button:first-child { margin-right:auto }
    .primary { color:#fff; border-color:var(--green); background:var(--green) }
    .primary:hover:not(:disabled) { color:#fff; border-color:#0f512f; background:#0f512f }
    .status { min-height:24px; padding:0 20px 10px; color:var(--muted); font-size:12px }
    main { display:flex; flex-direction:column; min-height:0; padding:15px 18px 18px; gap:11px }
    .image-top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px }
    .image-tools { display:flex; align-items:center; justify-content:flex-end; gap:7px; flex-wrap:wrap }
    .image-tools button { padding:5px 9px; font-size:11px }
    .image-frame { flex:1; min-height:0; display:grid; place-items:center; overflow:auto; border:1px solid var(--line); border-radius:10px; background-color:#fff; background-image:linear-gradient(45deg,#f3f5f3 25%,transparent 25%),linear-gradient(-45deg,#f3f5f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f3f5f3 75%),linear-gradient(-45deg,transparent 75%,#f3f5f3 75%); background-size:18px 18px; background-position:0 0,0 9px,9px -9px,-9px 0px }
    .image-stage { position:relative; display:inline-block; max-width:100%; max-height:100%; line-height:0 }
    .image-frame img { display:block; max-width:100%; max-height:100%; object-fit:contain }
    .region-overlay { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
    .image-frame.drawing .region-overlay { pointer-events:auto; cursor:crosshair; touch-action:none }
    .image-frame.picking-origin .region-overlay { pointer-events:auto; cursor:crosshair; touch-action:none }
    .region-rect { fill:#17633d22; stroke:#17633d; stroke-width:3; vector-effect:non-scaling-stroke }
    .region-rect.draft { fill:#c8780022; stroke:#c87800; stroke-dasharray:7 5 }
    .origin-marker { fill:#fff; stroke:#b52b25; stroke-width:4; vector-effect:non-scaling-stroke }
    .origin-crosshair { stroke:#b52b25; stroke-width:2; vector-effect:non-scaling-stroke }
    .origin-preview { stroke:#b52b25; stroke-width:3; stroke-dasharray:6 4; vector-effect:non-scaling-stroke }
    .image-frame.empty { color:var(--muted); background:#f8faf8; background-image:none }
    .image-meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:11px }
    .image-meta span:last-child { text-align:right }
    .error { color:#a22; padding:30px }
    dialog { position:fixed; inset:64px auto 0 0; width:min(43vw,720px); min-width:min(390px,100vw); height:calc(100vh - 64px); max-width:none; max-height:none; margin:0; padding:0; border:1px solid var(--line); border-left:0; border-radius:0 12px 12px 0; color:var(--ink); box-shadow:8px 0 32px #14251b22 }
    dialog[open] { display:flex; flex-direction:column }
    dialog::backdrop { background:transparent }
    .modal-head,.modal-foot { position:sticky; z-index:2; display:flex; align-items:center; gap:12px; padding:14px 18px; background:#fff }
    .modal-head { top:0; border-bottom:1px solid var(--line) }
    .modal-head h2 { margin:0; font-size:16px }
    .modal-head p { margin:3px 0 0; color:var(--muted); font-size:12px }
    .step-progress { height:4px; margin-top:9px; overflow:hidden; border-radius:9px; background:#e8eee9 }
    .step-progress span { display:block; height:100%; width:0; background:var(--green); transition:width .15s ease }
    .modal-foot { bottom:0; justify-content:flex-end; border-top:1px solid var(--line) }
    .modal-content { flex:1; min-height:0; overflow-y:auto; padding:12px 18px 18px }
    .metadata-step[hidden] { display:none }
    .metadata-step-title { margin:4px 0 14px; font-size:17px }
    .wizard-description { margin:0 0 14px; color:var(--muted); font-size:13px }
    .metadata-step-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px }
    .meta-section { margin:10px 0; border:1px solid var(--line); border-radius:9px; background:#fbfcfb }
    .meta-section summary { padding:10px 12px; cursor:pointer; font-weight:700; text-transform:capitalize }
    .meta-fields { display:grid; grid-template-columns:1fr 1fr; gap:11px 14px; padding:2px 12px 14px }
    .meta-field { min-width:0 }
    .meta-field.wide { grid-column:1/-1 }
    .meta-field label { display:block; margin:0 0 4px; color:var(--muted); font-size:11px; overflow-wrap:anywhere }
    .meta-field input,.meta-field select,.meta-field textarea { width:100%; min-width:0; border:1px solid var(--line); border-radius:7px; padding:7px 9px; color:var(--ink); background:#fff; font:13px/1.4 ui-sans-serif,system-ui,sans-serif }
    .color-controls { display:grid; grid-template-columns:48px 1fr; gap:8px; align-items:center }
    .color-controls input[type="color"] { width:48px; height:36px; padding:3px; cursor:pointer }
    .color-controls input[type="text"] { min-width:0 }
    .ratio-inputs { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:end }
    .ratio-inputs input { min-width:0 }
    .ratio-operand label { display:block; margin:0 0 4px; color:var(--muted); font-size:10px }
    .ratio-result { margin-top:5px; color:var(--muted); font-size:11px }
    .coordinate-inputs { display:grid; grid-template-columns:1fr 1fr; gap:8px }
    .enum-checks { display:flex; flex-wrap:wrap; gap:7px }
    .enum-check { display:flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:12px; cursor:pointer }
    .enum-check input { width:auto; margin:0 }
    .string-list-input { min-height:84px; resize:vertical; font-family:inherit; font-size:13px }
    .structured-list { display:flex; flex-direction:column; gap:9px }
    .structured-row { padding:9px; border:1px solid var(--line); border-radius:8px; background:#fff }
    .structured-row-head { display:flex; align-items:center; gap:8px; margin-bottom:8px }
    .structured-row-head strong { font-size:12px }
    .structured-row-head button { margin-left:auto; padding:4px 7px; font-size:11px }
    .structured-row-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
    .structured-row-fields .wide { grid-column:1/-1 }
    .structured-row-fields label { display:block; margin:0 0 4px; color:var(--muted); font-size:10px }
    .structured-row-fields input,.structured-row-fields select,.structured-row-fields textarea { width:100%; min-width:0; border:1px solid var(--line); border-radius:7px; padding:7px 9px; color:var(--ink); background:#fff; font:13px/1.4 ui-sans-serif,system-ui,sans-serif }
    .structured-list-add { align-self:flex-start; padding:6px 9px; font-size:11px }
    .meta-field select[multiple] { min-height:105px }
    .meta-field textarea { min-height:76px; resize:vertical; font-family:ui-monospace,SFMono-Regular,monospace; font-size:12px }
    .meta-field input:focus,.meta-field select:focus,.meta-field textarea:focus { outline:2px solid #17633d33; border-color:#659576 }
    .meta-field input:disabled,.meta-field select:disabled,.meta-field textarea:disabled { background:#eef1ee; color:#748078 }
    .field-hint { margin-top:3px; color:#78837c; font-size:10px }
    .modal-error { margin:10px 0 0; color:#a22; font-size:12px; white-space:pre-wrap }
    @media(max-width:640px) { .meta-fields,.metadata-step-fields { grid-template-columns:1fr } .meta-field.wide { grid-column:auto } }
    @media(max-width:800px) { body { height:auto; min-height:100vh; overflow:auto } .layout { height:auto; min-height:calc(100vh - 64px); grid-template-columns:1fr; grid-template-rows:minmax(550px, 60vh) minmax(400px, 55vh) } aside { border-right:0; border-bottom:1px solid var(--line) } main { min-height:420px } dialog { inset:64px 0 0; width:100vw; min-width:0; height:calc(100vh - 64px); border-radius:0; border-left:1px solid var(--line) } }
  </style>
</head>
<body>
  <header><div class="brand">V</div><h1>OCR-Transkripte prüfen</h1><div class="grow"></div><div class="counter" id="globalCount">Lade Katalog …</div></header>
  <div class="layout">
    <aside>
      <div class="filters">
        <div><label class="small" for="dataset">Datensatz</label><select id="dataset"><option value="">Alle OCR-Datensätze</option></select></div>
        <div><label class="small" for="statusFilter">Ansicht</label><select id="statusFilter"><option value="pending">Offen</option><option value="all">Alle</option><option value="approved">Freigegeben</option></select></div>
        <div class="counts" id="filterCount"></div>
      </div>
      <div class="itemnav"><button id="prev" title="Vorheriger Eintrag">← Zurück</button><button id="nextTop" title="Überspringen">Überspringen →</button><span id="position" class="item-position"></span></div>
      <div class="record-info"><div class="record-title" id="sampleId">Wähle einen Eintrag</div><div class="meta" id="badges"></div></div>
      <section class="metadata-panel" id="metadataPanel" aria-label="Bild-Metadaten">
        <div class="metadata-title metadata-title-row"><span>Bild-Metadaten</span><button id="editMetadata" type="button">Bearbeiten …</button></div>
        <div class="metadata-grid" id="metadataGrid"><div class="metadata-value">Wird geladen …</div></div>
        <div class="metadata-note" id="fontNote"></div>
      </section>
      <div class="scope-warning" id="scopeWarning" hidden></div>
      <div class="editor-wrap"><label class="small" for="transcript">Referenztext im Bild</label><textarea id="transcript" spellcheck="false" placeholder="Kein Text verfügbar"></textarea><div class="edit-foot"><span id="editStatus">Zeilenumbrüche im Quelltext bleiben erhalten.</span><span id="dirty" class="dirty"></span></div></div>
      <div class="actions"><button id="save">Text speichern</button><button id="approve" class="primary">Freigeben &amp; weiter</button></div>
      <div id="status" class="status" role="status"></div>
    </aside>
    <main>
      <div class="image-top"><span>Quellbild</span><div class="image-tools"><span id="dimensions"></span><button id="drawRegions" type="button" title="Textbereiche direkt im Bild mit der Maus markieren">Bereiche markieren</button><button id="undoRegion" type="button" disabled>Letzte Markierung löschen</button><button id="saveRegions" class="primary" type="button" disabled>Markierungen speichern</button><button id="textOriginTool" type="button" title="Textursprung direkt im Bild festlegen">Textursprung markieren</button><button id="revealImage" type="button" title="Bilddatei im Finder markieren, dann in Photoshop ziehen">Im Finder zeigen</button></div></div>
      <div class="image-frame empty" id="imageFrame">Bild wird geladen …</div>
      <div class="image-meta"><span id="imagePath"></span><span id="regionStatus">Textbereiche noch nicht markiert</span></div>
    </main>
  </div>
  <dialog id="metadataDialog">
    <div class="modal-head"><div><h2>Metadaten Schritt für Schritt</h2><p id="metadataStepTitle"></p><div class="step-progress"><span id="metadataProgress"></span></div></div><div class="grow"></div><button id="closeMetadata" type="button" aria-label="Schließen">Schließen</button></div>
    <div class="modal-content"><div id="metadataForm"></div><div id="metadataError" class="modal-error" role="alert"></div></div>
    <div class="modal-foot"><button id="metadataBack" type="button">← Zurück</button><span class="field-hint" style="margin-right:auto">Unbekanntes darf leer bleiben.</span><button id="cancelMetadata" type="button">Abbrechen</button><button id="metadataNext" class="primary" type="button">Weiter →</button><button id="saveMetadata" class="primary" type="button" hidden>Metadaten speichern</button></div>
  </dialog>
<script>
const $ = (id) => document.getElementById(id);
const state = { queue: [], index: 0, record: null, revision: null, originalText: "", dirty: false, datasets: [], schema: null, metadataStep: 0, regionDraft: null, regionSvg: null, drawMode: false, originMode: false };
const scopeLabels = { all_visible_text:"gesamter sichtbarer Text", source_declared_text:"quellseitig deklarierter Text", target_text_only:"nur Zieltext", source_declared_no_text:"Quelle deklariert keinen Text", none:"kein Transkript" };
const qualityLabels = { gold:"Gold", silver:"Silver", bronze:"Bronze", unlabeled:"unbeschriftet" };
function setStatus(text, error=false) { $("status").textContent = text; $("status").style.color = error ? "#a22" : ""; }
function markDirty() { state.dirty = $("transcript").value !== state.originalText; $("dirty").textContent = state.dirty ? "Nicht gespeichert" : ""; }
function esc(value) { return String(value ?? ""); }
function humanize(value) { return esc(value).replaceAll("_", " "); }
function regionSummary(regions) {
  if (!Array.isArray(regions) || regions.length===0) return "nicht annotiert";
  return regions.map(region=>{
    const role=region.role ? humanize(region.role) : "Textbereich";
    const box=Array.isArray(region.bbox_xywh) ? ` · [${region.bbox_xywh.join(", ")}] px` : "";
    return `${role}${box}`;
  }).join("; ");
}
function cloneJson(value) { return value==null?value:JSON.parse(JSON.stringify(value)); }
function regionBoxPixels(region,record) {
  if(!Array.isArray(region?.bbox_xywh)||region.bbox_xywh.length!==4)return null;
  const box=region.bbox_xywh.map(Number);
  if(region.coordinate_system==="normalized_0_1")return [box[0]*record.asset.width,box[1]*record.asset.height,box[2]*record.asset.width,box[3]*record.asset.height];
  return box;
}
function singleRegionOrigin(record=state.record,regions=state.regionDraft) {
  if(!record||!Array.isArray(regions)||regions.length!==1)return null;
  const box=regionBoxPixels(regions[0],record); if(!box)return null;
  return [Math.round(box[0]),Math.round(box[1])];
}
function effectiveTextOrigin(record=state.record,regions=state.regionDraft) {
  const stored=record?.visual?.typography?.text_origin_xy_px;
  return Array.isArray(stored)&&stored.length===2?stored:singleRegionOrigin(record,regions);
}
function renderRegionOverlay(svg,record,regions=[]) {
  if(!svg||!record)return;
  svg.replaceChildren();
  (Array.isArray(regions)?regions:[]).forEach((region,index)=>{
    const box=regionBoxPixels(region,record); if(!box)return;
    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",box[0]); rect.setAttribute("y",box[1]); rect.setAttribute("width",box[2]); rect.setAttribute("height",box[3]);
    rect.setAttribute("class",`region-rect${index>=(record.ocr.regions?.length||0)?" draft":""}`);
    rect.setAttribute("aria-label",`Textbereich ${index+1}`); svg.append(rect);
  });
  const origin=effectiveTextOrigin(record,regions);
  if(origin){
    const marker=document.createElementNS("http://www.w3.org/2000/svg","g"); marker.setAttribute("aria-label",`Textursprung x ${origin[0]}, y ${origin[1]} Pixel`);
    for(const [x1,y1,x2,y2] of [[origin[0]-12,origin[1],origin[0]+12,origin[1]],[origin[0],origin[1]-12,origin[0],origin[1]+12]]){
      const line=document.createElementNS("http://www.w3.org/2000/svg","line"); line.setAttribute("x1",x1);line.setAttribute("y1",y1);line.setAttribute("x2",x2);line.setAttribute("y2",y2);line.setAttribute("class","origin-crosshair");marker.append(line);
    }
    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");circle.setAttribute("cx",origin[0]);circle.setAttribute("cy",origin[1]);circle.setAttribute("r",6);circle.setAttribute("class","origin-marker");marker.append(circle);svg.append(marker);
  }
}
function regionsChanged() { return Boolean(state.record&&JSON.stringify(state.regionDraft)!==JSON.stringify(state.record.ocr.regions)); }
function updateRegionTools() {
  const hasImage=Boolean(state.record&&state.regionSvg);
  $("drawRegions").disabled=!hasImage;
  $("drawRegions").textContent=state.drawMode?"Markieren beenden":"Bereiche markieren";
  $("undoRegion").disabled=!hasImage||!Array.isArray(state.regionDraft)||state.regionDraft.length===0;
  const changed=regionsChanged();
  $("saveRegions").disabled=!changed;
  const regions=Array.isArray(state.regionDraft)?state.regionDraft:[];
  const autoOrigin=singleRegionOrigin();
  const storedOrigin=state.record?.visual?.typography?.text_origin_xy_px;
  const originButton=$("textOriginTool");
  originButton.disabled=!hasImage||changed;
  originButton.textContent=state.originMode?"Textursprung beenden":regions.length===1?"Ursprung aus Region": "Textursprung markieren";
  originButton.title=regions.length===1?"Die linke obere Ecke der einzigen Textregion übernehmen":"Startpunkt der ersten Textzeile im Bild anklicken oder ziehen";
  $("imageFrame").classList.toggle("drawing",state.drawMode&&hasImage);
  $("imageFrame").classList.toggle("picking-origin",state.originMode&&hasImage);
  const regionText=state.drawMode?"Ziehe ein Rechteck um jeden Textbereich.":changed?`${regions.length} Markierung(en) ungespeichert`:regions.length?`${regions.length} gespeicherte Textregion(en)`:"Textbereiche noch nicht markiert";
  const originText=state.originMode?"Ziehe einen Strich vom Anfang der ersten Textzeile; dessen Startpunkt wird übernommen.":Array.isArray(storedOrigin)?`Textursprung [${storedOrigin.join(", ")}] px`:autoOrigin?`Automatischer Textursprung [${autoOrigin.join(", ")}] px · noch nicht gespeichert`:"Textursprung noch nicht gesetzt";
  $("regionStatus").textContent=`${regionText} · ${originText}`;
}
function installRegionDrawing(svg,record) {
  let start=null,preview=null,activeMode=null;
  const point=event=>{
    const bounds=svg.getBoundingClientRect();
    return {x:Math.max(0,Math.min(record.asset.width,(event.clientX-bounds.left)*record.asset.width/bounds.width)),y:Math.max(0,Math.min(record.asset.height,(event.clientY-bounds.top)*record.asset.height/bounds.height))};
  };
  const setBox=(rect,a,b)=>{
    rect.setAttribute("x",Math.min(a.x,b.x)); rect.setAttribute("y",Math.min(a.y,b.y));
    rect.setAttribute("width",Math.abs(b.x-a.x)); rect.setAttribute("height",Math.abs(b.y-a.y));
  };
  svg.addEventListener("pointerdown",event=>{
    if(event.button!==0)return;
    if(state.originMode){
      event.preventDefault();activeMode="origin";start=point(event);preview=document.createElementNS("http://www.w3.org/2000/svg","line");preview.setAttribute("class","origin-preview");svg.append(preview);svg.setPointerCapture(event.pointerId);preview.setAttribute("x1",start.x);preview.setAttribute("y1",start.y);preview.setAttribute("x2",start.x);preview.setAttribute("y2",start.y);return;

    $("badges").replaceChildren(...badges.map((value,i)=>{const el=document.createElement("span");el.className="pill"+(i===1&&r.ocr.scope==="target_text_only"?" warn":"");el.textContent=value;return el;}));
    const warning=r.ocr.scope==="target_text_only" ? "<strong>Nur Zieltext:</strong> Bitte nur den im Datensatz definierten Zieltext prüfen. Freigabe bestätigt nicht, dass sämtlicher anderer sichtbarer Bildtext transkribiert ist." : r.ocr.scope==="source_declared_text" ? "<strong>Quellreferenz:</strong> Freigabe bestätigt den quellseitig angegebenen Text. Prüfe, ob er im Bild lesbar und exakt wiedergegeben ist; sie bestätigt nicht automatisch eine vollständige Erfassung weiterer sichtbarer Texte." : "<strong>Prüfumfang:</strong> Bitte den Text gemäß dem oben genannten Referenzumfang visuell mit dem Bild abgleichen.";
    $("scopeWarning").innerHTML=warning; $("scopeWarning").hidden=false;
    $("transcript").value=state.originalText; markDirty();
    $("dimensions").textContent=`${r.asset.width} × ${r.asset.height} · ${r.asset.format}`;
    $("imagePath").textContent=r.asset.path;
    const image=document.createElement("img"); image.alt=`Bild zu ${r.sample_id}`; image.src=`/image?id=${encodeURIComponent(r.sample_id)}`;
    const stage=document.createElement("div"); stage.className="image-stage"; const overlay=document.createElementNS("http://www.w3.org/2000/svg","svg"); overlay.classList.add("region-overlay"); overlay.setAttribute("viewBox",`0 0 ${r.asset.width} ${r.asset.height}`); overlay.setAttribute("preserveAspectRatio","none"); stage.append(image,overlay);
    image.onload=()=>{$("imageFrame").className="image-frame";$("imageFrame").replaceChildren(stage);state.regionSvg=overlay;installRegionDrawing(overlay,r);renderRegionOverlay(overlay,r,state.regionDraft);updateRegionTools();};
    image.onerror=()=>{$("imageFrame").className="image-frame empty";$("imageFrame").textContent="Bilddatei konnte nicht geladen werden.";};
    $("imageFrame").className="image-frame empty"; $("imageFrame").textContent="Bild wird geladen …";
    setStatus("");
  } catch(error) { setStatus(error.message,true); }
}
async function save(approve, advance=false) {
  if (!state.record) return;
  if(regionsChanged()){setStatus("Bitte Textregionen zuerst separat speichern oder verwerfen.",true);return;}
  const nextId=advance ? state.queue[state.index+1]?.sample_id : null;
  const buttons=[$("save"),$("approve"),$("prev"),$("nextTop")]; buttons.forEach(button=>button.disabled=true);
  setStatus(approve ? "Speichere und gebe frei …" : "Speichere …");
  try {
    const result=await request("/api/save", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({sample_id:state.record.sample_id,revision:state.revision,text:$("transcript").value,approve}) });
    const id=state.record.sample_id;
    state.originalText=result.record.ocr.transcript_verbatim; state.revision=result.revision; state.record=result.record; state.dirty=false; markDirty();
    setStatus(approve ? "Freigegeben · als Gold markiert. Der nächste Eintrag wird geöffnet." : "Gespeichert. Noch nicht manuell freigegeben.");
    // In the pending queue the current entry disappears; in "all" it remains.
    // Preserve the next item's ID so both views advance to the right record.
    if (advance && nextId) { await refreshQueue(nextId); }
    else if (advance) { await refreshQueue(); }
    else { await refreshQueue(id); }
  } catch(error) { setStatus(error.message,true); buttons.forEach(button=>button.disabled=false); }
}
$("transcript").addEventListener("input",markDirty);
$("editMetadata").addEventListener("click",openMetadataEditor);
$("revealImage").addEventListener("click",async()=>{
  if(!state.record)return;
  const button=$("revealImage"); button.disabled=true;
  try {
    await request("/api/reveal-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sample_id:state.record.sample_id})});
    setStatus("Bild im Finder markiert — du kannst es jetzt in Photoshop ziehen.");
  } catch(error) { setStatus(error.message,true); }
  finally { button.disabled=false; }
});
$("drawRegions").addEventListener("click",()=>{
  if(!state.regionSvg)return;
  state.originMode=false;state.drawMode=!state.drawMode; updateRegionTools();
  setStatus(state.drawMode?"Ziehe mit gedrückter Maustaste ein Rechteck um den sichtbaren Zieltext.":"Markierungsmodus beendet.");
});
$("textOriginTool").addEventListener("click",()=>{
  if(!state.regionSvg||regionsChanged())return;
  state.drawMode=false;
  const origin=singleRegionOrigin();
  if(origin){state.originMode=false;updateRegionTools();void saveTextOrigin(origin);return;}
  state.originMode=!state.originMode;updateRegionTools();
  setStatus(state.originMode?"Klicke oder ziehe vom Anfang der ersten Textzeile; der Startpunkt wird als Pixelkoordinate gespeichert.":"Textursprung-Markierung beendet.");
});
$("undoRegion").addEventListener("click",()=>{
  if(!Array.isArray(state.regionDraft)||!state.regionDraft.length)return;
  state.regionDraft.pop(); renderRegionOverlay(state.regionSvg,state.record,state.regionDraft); updateRegionTools();
});
$("saveRegions").addEventListener("click",saveRegionDraft);
$("saveMetadata").addEventListener("click",saveMetadata);
$("metadataBack").addEventListener("click",()=>showMetadataStep(state.metadataStep-1));
$("metadataNext").addEventListener("click",()=>showMetadataStep(state.metadataStep+1));
$("closeMetadata").addEventListener("click",()=>$("metadataDialog").close());
$("cancelMetadata").addEventListener("click",()=>$("metadataDialog").close());
$("save").addEventListener("click",()=>save(false));
$("approve").addEventListener("click",()=>save(true,true));
$("prev").addEventListener("click",async()=>{if(state.index>0){state.index--;await showCurrent();}});
$("nextTop").addEventListener("click",async()=>{if(state.index<state.queue.length-1){state.index++;await showCurrent();}});
$("dataset").addEventListener("change",()=>{state.index=0;refreshQueue();});
$("statusFilter").addEventListener("change",()=>{state.index=0;refreshQueue();});
document.addEventListener("keydown",event=>{if($("metadataDialog").open)return; if((event.metaKey||event.ctrlKey)&&event.key==="s"){event.preventDefault();save(false);} if((event.metaKey||event.ctrlKey)&&event.key==="Enter"){event.preventDefault();save(true,true);}});
request("/api/schema").then(schema=>{state.schema=schema;return refreshQueue();}).catch(error=>{document.body.innerHTML=`<p class="error">Katalog konnte nicht geladen werden: ${esc(error.message)}</p>`;});
</script>
</body>
</html>
